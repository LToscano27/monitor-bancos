name: Actualizar datos BCRA

on:
  schedule:
    # Corre todos los días, a la mañana y a la noche (hora argentina): las tasas de
    # mercado (TAMAR, pases) cambian a diario. De paso se chequea si el BCRA publicó un
    # período nuevo del balance; update.py es idempotente y si no hay nada no toca nada.
    - cron: "0 12 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Detectar y procesar períodos nuevos
        id: update
        run: |
          python pipeline/update.py | tee update.log
          echo "new_periods=$(grep -oP '(?<=^NEW_PERIODS=).*' update.log | tail -1)" >> "$GITHUB_OUTPUT"

      # Las tasas de mercado son diarias: se refrescan en cada corrida, haya o no un
      # período nuevo del balance. Si la API falla no se frena el resto.
      - name: Actualizar tasas de mercado
        run: |
          python pipeline/tasas_mercado.py || echo "aviso - no se pudieron actualizar las tasas"

      - name: Commitear datos nuevos
        run: |
          git config user.name "Lautaro Toscano"
          git config user.email "lautaro.toscano27@gmail.com"
          git add data/ web/public/logos/
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          if [ -n "${{ steps.update.outputs.new_periods }}" ]; then
            git commit -m "data: período(s) ${{ steps.update.outputs.new_periods }} [bot]"
          else
            git commit -m "data: tasas de mercado [bot]"
          fi
          git push
